<!DOCTYPE html>
<html>
<head>
<title>Water Intake Tracker</title>

<style>
body {
    margin: 0;
    background: linear-gradient(#cceeff, #ffffff);
    text-align: center;
    font-family: Arial;
    overflow: hidden; /* needed for rain/cloud */
}

/* -------- ☁️ CLOUDS -------- */
.cloud {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    z-index: 0;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 50px;
    height: 50px;
    top: -20px;
    left: 10px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    top: -30px;
    right: 10px;
}

.cloud1 {
    width: 120px;
    height: 60px;
    top: 40px;
    left: -150px;
    animation: moveClouds 30s linear infinite;
}

.cloud2 {
    width: 150px;
    height: 70px;
    top: 120px;
    left: -200px;
    animation: moveClouds 45s linear infinite;
}

.cloud3 {
    width: 100px;
    height: 50px;
    top: 200px;
    left: -180px;
    animation: moveClouds 35s linear infinite;
}

@keyframes moveClouds {
    0% { transform: translateX(0); }
    100% { transform: translateX(120vw); }
}

/* -------- 🌧 RAIN -------- */
.rain {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 0;
}

.drop {
    position: absolute;
    width: 4px;
    height: 12px;
    background: rgba(255,255,255,0.6);
    animation: fall linear infinite;
}

@keyframes fall {
    0% {
        transform: translateY(-10px);
        opacity: 0.7;
    }
    100% {
        transform: translateY(100vh);
        opacity: 0;
    }
}

/* Neck */
.neck {
    width: 60px;
    height: 50px;
    margin: auto;
    border: 4px solid #444;
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    background: rgba(255,255,255,0.4);
}

/* Bottle */
.bottle {
    width: 170px;
    height: 400px;
    margin: auto;
    border: 4px solid #444;
    border-radius: 80px 80px 40px 40px;
    position: relative;
    overflow: hidden;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(6px);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2),
                0 15px 25px rgba(0,0,0,0.2);
    transition: transform 0.2s;
}

/* Water */
.water {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0%;
    overflow: hidden;
    transition: height 0.8s ease;
}

/* Water gradient */
.water-inner {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0066ff, #33ccff);
}

/* Waves */
.wave {
    position: absolute;
    width: 200%;
    height: 100px;
    top: -40px;
    left: -50%;
    background: rgba(255,255,255,0.5);
    border-radius: 40%;
    animation: waveMove 4s linear infinite;
}

.wave2 {
    animation-delay: 2s;
    opacity: 0.4;
}

@keyframes waveMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(50%); }	
}

/* Bubbles */
.bubble {
    position: absolute;
    bottom: 0;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: rise 5s infinite;
}

@keyframes rise {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-350px) scale(1); opacity: 0; }
}

/* Ice cubes */
.ice {
    position: absolute;
    width: 25px;
    height: 25px;
    background: rgba(255,255,255,0.6);
    border-radius: 6px;
    transform: rotate(20deg);
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0%   { transform: translateY(0) rotate(20deg); }
    50%  { transform: translateY(-10px) rotate(25deg); }
    100% { transform: translateY(0) rotate(20deg); }
}

/* Highlight */
.highlight {
    position: absolute;
    left: 15px;
    top: 10%;
    width: 30px;
    height: 80%;
    background: rgba(255,255,255,0.4);
    border-radius: 50px;
    filter: blur(3px);
}

/* Marks */
.mark {
    position: absolute;
    display: flex;
    align-items: center;
    width: 100%;
}

.line {
    width: 40px;
    height: 2px;
    background: black;
    margin-left: 10px;
}

.label {
    font-size: 12px;
    margin-left: 5px;
    background: rgba(255,255,255,0.7);
    padding: 2px 4px;
    border-radius: 5px;
}

.m750  { bottom: 33%; }
.m1500 { bottom: 66%; }
.m2250 { bottom: 94.5%; }

/* Buttons */
button {
    padding: 10px;
    margin: 10px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    background: #0077ff;
    color: white;
    cursor: pointer;
}

.info {
    font-size: 18px;
}
</style>
</head>

<body>

<!-- Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<!-- Rain -->
<div class="rain"></div>

<h2>💧 Water Intake Tracker</h2>

<div class="neck"></div>

<div class="bottle" id="bottle">
    <div class="highlight"></div>

    <div class="water" id="water">
        <div class="water-inner"></div>

        <div class="wave"></div>
        <div class="wave wave2"></div>

        <div class="ice" style="left:30%; top:60%;"></div>
        <div class="ice" style="left:60%; top:50%; animation-delay:1s;"></div>

        <div class="bubble" style="left:20%; width:8px; height:8px;"></div>
        <div class="bubble" style="left:50%; width:10px; height:10px; animation-delay:2s;"></div>
        <div class="bubble" style="left:70%; width:6px; height:6px;"></div>
    </div>

    <div class="mark m750"><div class="line"></div><div class="label">750 ml</div></div>
    <div class="mark m1500"><div class="line"></div><div class="label">1500 ml</div></div>
    <div class="mark m2250"><div class="line"></div><div class="label">2250 ml</div></div>
</div>

<div class="info">
    <span id="current">0</span> / 2250 ml
</div>

<button onclick="drink()">Drink 750 ml</button>
<button onclick="resetDay()">Reset</button>

<script>
const maxWater = 2250;
let currentWater = localStorage.getItem("water")
    ? parseInt(localStorage.getItem("water"))
    : 0;

function drink() {
    if (currentWater < maxWater) {
        currentWater += 750;
        if (currentWater > maxWater) currentWater = maxWater;
        updateUI();
        save();
    }
}

function resetDay() {
    currentWater = 0;
    updateUI();
    save();
}

function updateUI() {
    document.getElementById("current").innerText = currentWater;
    let percent = (currentWater / maxWater) * 100;
    document.getElementById("water").style.height = percent + "%";
}

function save() {
    localStorage.setItem("water", currentWater);
}

/* Rain generator */
function createRain() {
    const rain = document.querySelector(".rain");

    for (let i = 0; i < 50; i++) {
        let drop = document.createElement("div");
        drop.classList.add("drop");

        drop.style.left = Math.random() * 100 + "vw";
        drop.style.animationDuration = 0.5 + Math.random() * 1 + "s";
        drop.style.animationDelay = Math.random() * 5 + "s";

        rain.appendChild(drop);
    }
}

createRain();

/* Tilt effect */
const bottle = document.getElementById("bottle");

bottle.addEventListener("mousemove", e => {
    let rect = bottle.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    let rotateX = (y / rect.height - 0.5) * 10;
    let rotateY = (x / rect.width - 0.5) * -10;

    bottle.style.transform =
        `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

bottle.addEventListener("mouseleave", () => {
    bottle.style.transform = "rotateX(0deg) rotateY(0deg)";
});

updateUI();
</script>

</body>
</html>
